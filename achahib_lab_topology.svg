<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1390" viewBox="0 0 1100 1390" role="img" aria-labelledby="title desc"><title id="title">Achahib Lab Architecture</title><desc id="desc">Cisco VLAN gateways, OPNsense security edge, separate cloudflared and Ubuntu Mesh connectors, PacketFence NAC, hybrid identity, server services and automated backups. Logical paths are not physical cabling.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="context-stroke"/></marker><style>text{font-family:Arial,sans-serif;fill:#dce7f7}.heading{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#9fb1ca}.name{font-size:17px;font-weight:700}.line{font-size:13px;fill:#b8cbe5}</style></defs><rect width="1100" height="1390" rx="18" fill="#0d1726"/><text x="40" y="44" class="heading">ACHAHIB LAB</text><text x="40" y="69" class="sub">Network, Zero Trust, identity and infrastructure automation</text><path d="M180 190V245" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M180 355V445" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><text x="195" y="404" font-family="Arial" font-size="12" style="fill:#a9bcd6">Routing / firewall policies</text><path d="M180 535V600" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M740 300H665" stroke="#f5ad45" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M385 300H320" stroke="#f5ad45" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M525 190V220H875V245" stroke="#f5ad45" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M320 330H350V400H385" stroke="#4dd3be" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M665 407H1028V355" stroke="#4dd3be" fill="none" stroke-width="2"  marker-end="url(#a)"/><text x="703" y="395" font-family="Arial" font-size="12" style="fill:#4dd3be">Mesh egress → Gateway → Internet</text><path d="M875 190V245" stroke="#90a7ff" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1060 490H1080V148H1060" stroke="#90a7ff" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="747" y="565" font-family="Arial" font-size="12" style="fill:#90a7ff">AD Connect / hybrid identity</text><path d="M180 690V735H1000V770" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M180 735H100V770" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M340 735V770" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M580 735V770" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M820 735V770" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><path d="M320 645H385" stroke="#c69aff" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="330" y="630" font-family="Arial" font-size="12" style="fill:#c69aff">RADIUS</text><path d="M320 670H350V710H900V690" stroke="#7c95b5" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M665 645H700V520H740" stroke="#c69aff" stroke-dasharray="7 5" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="105" width="280" height="85" rx="12" fill="#283445" stroke="#587496"/><text x="56" y="134" class="name">Internet / ISP</text><text x="56" y="158" class="line">WAN connectivity</text><rect x="385" y="105" width="280" height="85" rx="12" fill="#183252" stroke="#587496"/><text x="401" y="134" class="name">Remote user</text><text x="401" y="158" class="line">Cloudflare One Client (WARP)</text><rect x="740" y="105" width="320" height="85" rx="12" fill="#27305a" stroke="#587496"/><text x="756" y="134" class="name">Microsoft Entra ID</text><text x="756" y="158" class="line">Identity provider / Cloudflare Access</text><rect x="40" y="245" width="280" height="110" rx="12" fill="#542b36" stroke="#587496"/><text x="56" y="274" class="name">OPNsense + Zenarmor</text><text x="56" y="298" class="line">Firewall, NAT and local inspection</text><text x="56" y="318" class="line">cloudflared hosted on OPNsense</text><rect x="385" y="245" width="280" height="110" rx="12" fill="#57401d" stroke="#587496"/><text x="401" y="274" class="name">Achahib-ZEROTRUST</text><text x="401" y="298" class="line">cloudflared logical connector</text><text x="401" y="318" class="line">Private routes + published apps</text><rect x="740" y="245" width="320" height="110" rx="12" fill="#57401d" stroke="#587496"/><text x="756" y="274" class="name">Cloudflare One</text><text x="756" y="298" class="line">Access: application authorization</text><text x="756" y="318" class="line">Gateway: cloud security and logs</text><rect x="385" y="370" width="280" height="85" rx="12" fill="#174b48" stroke="#587496"/><text x="401" y="399" class="name">Achahib-FullTunnel</text><text x="401" y="423" class="line">Ubuntu Mesh / former WARP Connector</text><rect x="40" y="445" width="280" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="56" y="474" class="name">Cisco Router</text><text x="56" y="498" class="line">VLAN gateways / inter-VLAN routing</text><text x="56" y="518" class="line">ACLs and QoS</text><rect x="740" y="445" width="320" height="90" rx="12" fill="#27305a" stroke="#587496"/><text x="756" y="474" class="name">Active Directory / CA</text><text x="756" y="498" class="line">achahib.local • DNS / Kerberos / GPO</text><text x="756" y="518" class="line">Enterprise CA for EAP-TLS</text><rect x="40" y="600" width="280" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="56" y="629" class="name">Cisco access switching</text><text x="56" y="653" class="line">Catalyst 3750 + SG300</text><text x="56" y="673" class="line">VLAN trunks / wired 802.1X</text><rect x="385" y="600" width="280" height="90" rx="12" fill="#3f2d55" stroke="#587496"/><text x="401" y="629" class="name">PacketFence NAC</text><text x="401" y="653" class="line">RADIUS + AD integration</text><text x="401" y="673" class="line">NOC-SURFACE: EAP-TLS validated</text><rect x="740" y="600" width="320" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="756" y="629" class="name">Wireless access</text><text x="756" y="653" class="line">UniFi AP-01 / AP-02 registered</text><text x="756" y="673" class="line">Wireless NAC validation separate</text><text x="40" y="722" class="sub">VLAN SEGMENTATION • existing VLAN inventory retained</text><rect x="40" y="770" width="200" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="56" y="799" class="name">VLAN 1 • MGMT</text><text x="56" y="823" class="line">Infrastructure / servers</text><rect x="260" y="770" width="200" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="276" y="799" class="name">VLAN 11 • WIFI</text><text x="276" y="823" class="line">Wireless endpoints</text><rect x="480" y="770" width="200" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="496" y="799" class="name">VLAN 20 • LABs</text><text x="496" y="823" class="line">Lab / testing</text><rect x="700" y="770" width="160" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="716" y="799" class="name">VLAN 44</text><text x="716" y="823" class="line">VOIP</text><rect x="880" y="770" width="180" height="90" rx="12" fill="#183252" stroke="#587496"/><text x="896" y="799" class="name">VLAN 50</text><text x="896" y="823" class="line">DMZ</text><rect x="260" y="880" width="200" height="75" rx="12" fill="#183252" stroke="#587496"/><text x="276" y="909" class="name">VLAN 98</text><text x="276" y="933" class="line">INT-LABs</text><rect x="480" y="880" width="200" height="75" rx="12" fill="#183252" stroke="#587496"/><text x="496" y="909" class="name">VLAN 100</text><text x="496" y="933" class="line">HOME</text><rect x="700" y="880" width="160" height="75" rx="12" fill="#183252" stroke="#587496"/><text x="716" y="909" class="name">VLAN 101</text><text x="716" y="933" class="line">Test</text><rect x="40" y="985" width="490" height="120" rx="12" fill="#183252" stroke="#587496"/><text x="56" y="1014" class="name">Virtualization and internal services</text><text x="56" y="1038" class="line">VMware ESXi • Hyper-V • Windows Server / AD</text><text x="56" y="1058" class="line">Nextcloud • FileShare • HMIND • Server Admin</text><text x="56" y="1078" class="line">Wazuh • OpenVAS • Zabbix • Rudder • UrBackup</text><rect x="550" y="985" width="510" height="120" rx="12" fill="#174b48" stroke="#587496"/><text x="566" y="1014" class="name">Centralized automated backup</text><text x="566" y="1038" class="line">Windows: AD GPO / Backup_Servers → UrBackup</text><text x="566" y="1058" class="line">Linux: Rudder install_urbackup → UrBackup</text><text x="566" y="1078" class="line">Network: daily SSH → compressed configuration archives</text><rect x="40" y="1130" width="1020" height="105" rx="12" fill="#302d54" stroke="#587496"/><text x="56" y="1159" class="name">Existing VPN architecture • retained</text><text x="56" y="1183" class="line">WireGuard client on OPNsense → VPS WireGuard server / OpenVPN relay</text><text x="56" y="1203" class="line">OpenVPN remote access and the documented double-tunnel setup remain separate from Cloudflare paths</text><text x="40" y="1275" class="sub">LOGICAL PATHS</text><path d="M40 1300H90" stroke="#7c95b5" fill="none" stroke-width="2"  marker-end="url(#a)"/><text x="105" y="1305" font-family="Arial" font-size="12" style="fill:#a9bcd6">LAN / WAN</text><path d="M280 1300H330" stroke="#f5ad45" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="345" y="1305" font-family="Arial" font-size="12" style="fill:#a9bcd6">Cloudflare private access</text><path d="M600 1300H650" stroke="#4dd3be" fill="none" stroke-width="2"  marker-end="url(#a)"/><text x="665" y="1305" font-family="Arial" font-size="12" style="fill:#a9bcd6">Selected Internet egress</text><text x="40" y="1350" class="sub">Only traffic selected by routing policy uses Mesh. Application policies and private network controls have separate scopes.</text></svg>